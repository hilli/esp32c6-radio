name: Software gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
      - name: Install pinned TinyGo
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo0.42.0.linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/tinygo.tar.gz"
          echo "b87688fa2e19cee7d813cad7fd7dadb71dff3198e47125aba66ba4af5e490438  $RUNNER_TEMP/tinygo.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
      - run: make check
      - run: make consumer
